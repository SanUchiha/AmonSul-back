name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore AmonSul/AS.API/AS.API.csproj

      - name: Create appsettings.json
        run: |
          echo '${{ secrets.APPSETTINGS_JSON }}' > AmonSul/AS.API/appsettings.json
        shell: pwsh

      # La clave JWT y la contraseña del correo, cada una en su propio secreto: así no están en APPSETTINGS_JSON
      # ni en el appsettings.json de nadie. Solo pisan el valor si el secreto existe
      - name: Inject secrets
        env:
          JWT_KEY: ${{ secrets.JWT_KEY }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        # Los avisos van como anotaciones (::notice:: y ::error::), que se leen sin entrar en GitHub. Nunca con valores
        run: |
          $ruta = "AmonSul/AS.API/appsettings.json"
          try {
            $config = Get-Content $ruta -Raw | ConvertFrom-Json -ErrorAction Stop
          } catch {
            Write-Output "::error::APPSETTINGS_JSON no es un JSON válido: revisa comas y comillas al editarlo."
            exit 1
          }
          $secciones = ($config.PSObject.Properties.Name) -join ", "
          $jwt = if ($env:JWT_KEY) { "presente" } else { "vacío o sin acceso" }
          $correo = if ($env:EMAIL_PASSWORD) { "presente" } else { "vacío o sin acceso" }
          Write-Output "::notice::JWT_KEY: $jwt. EMAIL_PASSWORD: $correo. Secciones de APPSETTINGS_JSON: $secciones."

          if (-not $config.EmailSettings) {
            Write-Output "::error::Falta la sección EmailSettings en APPSETTINGS_JSON: deja la sección con el campo Password vacío."
            exit 1
          }
          if (-not $config.Jwt) {
            $config | Add-Member -NotePropertyName Jwt -NotePropertyValue ([pscustomobject]@{}) -Force
          }
          if ($env:JWT_KEY) {
            $config.Jwt | Add-Member -NotePropertyName key -NotePropertyValue $env:JWT_KEY -Force
          }
          if ($env:EMAIL_PASSWORD) {
            $config.EmailSettings | Add-Member -NotePropertyName Password -NotePropertyValue $env:EMAIL_PASSWORD -Force
          }
          # Sin clave de firma el back no arranca: mejor parar aquí que desplegar algo roto
          if (-not $config.Jwt.key) {
            Write-Output "::error::Falta la clave JWT: crea el secreto de repositorio JWT_KEY en Settings, Secrets and variables, Actions."
            exit 1
          }
          if (-not $config.EmailSettings.Password) {
            Write-Output "::warning::Sin contraseña de correo: no se enviarán correos."
          }
          $config | ConvertTo-Json -Depth 20 | Set-Content $ruta -Encoding utf8NoBOM
        shell: pwsh

      - name: Publish
        run: dotnet publish AmonSul/AS.API/AS.API.csproj -c Release -o publish

      - name: Deploy via MSDeploy
        env:
          MSDEPLOY_PASSWORD: ${{ secrets.MSDEPLOY_PASSWORD }}
        run: |
          $msdeploy = "C:\Program Files\IIS\Microsoft Web Deploy V3\msdeploy.exe"
          $publishPath = (Resolve-Path publish).Path
          $msdeployArgs = @(
            "-verb:sync",
            "-source:contentPath=$publishPath",
            "-dest:contentPath=sanuchiha-001-site1,computerName=https://win6218.site4now.net:8172/MsDeploy.axd?site=sanuchiha-001-site1,userName=sanuchiha-001,password=$env:MSDEPLOY_PASSWORD,authType=Basic",
            "-enableRule:DoNotDeleteRule",
            "-enableRule:AppOffline",
            "-retryAttempts:3",
            "-retryInterval:2000"
          )
          & $msdeploy @msdeployArgs
        shell: pwsh
